services:
  scheduler:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SALES_CAPACITY: ${SALES_CAPACITY:-220}
      SALES_DATA_PATH: ${SALES_DATA_PATH:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:stable
    profiles: ["tailscale"]
    network_mode: "service:scheduler"
    depends_on:
      scheduler:
        condition: service_healthy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
    command:
      - sh
      - -c
      - >-
        test -n "$$TS_AUTHKEY" || { echo "TS_AUTHKEY is required for the Tailscale profile." >&2; exit 1; };
        tailscaled --state=/var/lib/tailscale/tailscaled.state --tun=userspace-networking &
        until tailscale status --json >/dev/null 2>&1; do sleep 1; done;
        tailscale up --authkey="$$TS_AUTHKEY" --hostname=brians-awesome-scheduler --accept-dns=false;
        tailscale serve --bg --https=443 http://127.0.0.1:3000;
        wait
    restart: unless-stopped

volumes:
  tailscale-state:
